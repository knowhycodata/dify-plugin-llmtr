model: google/gemini-3.5-flash
label:
  en_US: Gemini 3.5 Flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 65536
  - name: top_p
    use_template: top_p
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    required: false
    options:
      - text
      - json_object
pricing:
  input: "1.5"
  output: "9"
  unit: "0.000001"
  currency: USD
