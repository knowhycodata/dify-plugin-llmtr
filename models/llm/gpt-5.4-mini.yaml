model: openai/gpt-5.4-mini
label:
  en_US: GPT-5.4 mini
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 128000
  - name: top_p
    use_template: top_p
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    required: false
    options:
      - text
      - json_object
pricing:
  input: "0.75"
  output: "4.5"
  unit: "0.000001"
  currency: USD
