model: llmtr/gemma-4
label:
  en_US: Gemma 4
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 131072
  - name: top_p
    use_template: top_p
pricing:
  input: "2"
  output: "5"
  unit: "0.000001"
  currency: USD
